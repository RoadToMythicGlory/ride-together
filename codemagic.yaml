# RideTogether — Capacitor builds (Codemagic Mac runners)
# The web UI (Next.js) is statically exported and BUNDLED into the app (no remote URL).
#
# One-time setup in the Codemagic UI:
# 1. Connect this GitHub repo
# 2. Team settings → Integrations → App Store Connect API key, named exactly: RideTogether
# 3. Environment variable group `ride_together_mobile` (optional but recommended):
#      NEXT_PUBLIC_API_URL  = https://YOUR-API-DOMAIN   (backend API; placeholder OK for first build)
#      APP_STORE_APPLE_ID   = numeric App Store Connect app id (after creating the app in ASC)
# 4. Code signing: automatic iOS signing for bundle id org.ridetogether.app
# 5. Start workflow: ios-testflight

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RideTogether
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.ridetogether.app
      groups:
        - ride_together_mobile
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build web UI (static export)
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/web"
          npm install --no-audit --no-fund
          export MOBILE_STATIC_EXPORT=1
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.ridetogether.invalid}"
          npx next build
          test -f out/index.html || { echo "Static export failed: out/index.html missing"; exit 1; }
      - name: Bundle web UI into Capacitor + sync native
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/mobile"
          npm install --no-audit --no-fund
          rm -rf www
          cp -R ../web/out www
          npx cap sync ios
      - name: CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/mobile/ios/App"
          pod install
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/apps/mobile/ios/App"
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
            agvtool new-version -all $((LATEST + 1))
          else
            agvtool new-version -all $((BUILD_NUMBER))
          fi
      - name: Build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/mobile"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
      - apps/mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false until ready for review

  android-release:
    name: Android release APK
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      groups:
        - ride_together_mobile
      node: 22
      java: 17
    scripts:
      - name: Build web UI (static export)
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/web"
          npm install --no-audit --no-fund
          export MOBILE_STATIC_EXPORT=1
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.ridetogether.invalid}"
          npx next build
      - name: Bundle + assemble
        script: |
          set -e
          cd "$CM_BUILD_DIR/apps/mobile"
          npm install --no-audit --no-fund
          rm -rf www
          cp -R ../web/out www
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - apps/mobile/android/app/build/outputs/**/*.apk
